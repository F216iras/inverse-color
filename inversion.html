<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversion Noir et Blanc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>

        @keyframes slideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter {
            animation: slideIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">


    <header class="bg-slate-800 p-6 shadow-md text-center">
        <h1 class="text-3xl font-bold tracking-wider"><i class="fas fa-adjust mr-2"></i> Inverser les Couleurs</h1>
        <p class="text-slate-400 mt-2">Transformez instantanément le noir en blanc et le blanc en noir</p>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl flex flex-col items-center">
        
        <div id="drop-zone" class="w-full max-w-2xl border-4 border-dashed border-slate-600 rounded-xl p-16 text-center cursor-pointer bg-slate-800/50 hover:bg-slate-800 transition-all duration-300 group">
            <input type="file" id="file-input" class="hidden" accept="image/png, image/jpeg, image/webp">
            <i class="fas fa-cloud-upload-alt text-6xl text-slate-500 group-hover:text-blue-400 transition-colors mb-4"></i>
            <h2 class="text-xl font-semibold mb-2">Cliquez ou glissez votre image ici</h2>
            <p class="text-slate-400 text-sm">Formats supportés : PNG, JPG, WEBP</p>
        </div>

        <div id="result-container" class="hidden w-full flex flex-col items-center mt-8 animate-fade-in">
            <div class="flex justify-between items-center w-full max-w-2xl mb-4">
                <h3 class="text-lg font-semibold text-slate-300">Résultat :</h3>
                <button id="download-btn" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium shadow-lg hover:shadow-blue-500/50 transition-all flex items-center gap-2">
                    <i class="fas fa-download"></i> Télécharger
                </button>
            </div>
            
            <div class="bg-slate-800 p-4 rounded-xl shadow-2xl overflow-hidden max-w-full">
                <canvas id="canvas" class="max-w-full h-auto rounded-lg"></canvas>
            </div>
            
            <button id="reset-btn" class="mt-6 text-slate-400 hover:text-white underline text-sm transition-colors">
                Traiter une autre image
            </button>
        </div>
    </main>

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const resultContainer = document.getElementById('result-container');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('download-btn');
        const resetBtn = document.getElementById('reset-btn');
        const toastContainer = document.getElementById('toast-container');

        let currentFilename = 'image_inversee.png';

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-500' : (type === 'success' ? 'bg-green-500' : 'bg-blue-500');
            
            toast.className = `${bgColor} text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 toast-enter`;
            
            const icon = type === 'error' ? 'fa-exclamation-circle' : (type === 'success' ? 'fa-check-circle' : 'fa-info-circle');
            toast.innerHTML = `<i class="fas ${icon}"></i> <span>${message}</span>`;
            
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function processImage(file) {
            if (!file || !file.type.startsWith('image/')) {
                showToast('Veuillez sélectionner un fichier image valide.', 'error');
                return;
            }

            const nameParts = file.name.split('.');
            const ext = nameParts.pop();
            currentFilename = `${nameParts.join('.')}_inverse.${ext}`;

            const reader = new FileReader();
            
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {

                    canvas.width = img.width;
                    canvas.height = img.height;
                    

                    ctx.drawImage(img, 0, 0);
                    

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    

                    for (let i = 0; i < data.length; i += 4) {
                        data[i]     = 255 - data[i];     
                        data[i + 1] = 255 - data[i + 1]; 
                        data[i + 2] = 255 - data[i + 2]; 
                    }
                    
                    ctx.putImageData(imageData, 0, 0);
                    
                    dropZone.classList.add('hidden');
                    resultContainer.classList.remove('hidden');
                    showToast('Couleurs inversées avec succès !', 'success');
                };
                img.src = event.target.result;
            };
            
            reader.readAsDataURL(file);
        }


        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processImage(e.target.files[0]);
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-white', 'bg-slate-700');
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-white', 'bg-slate-700');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-white', 'bg-slate-700');
            
            if (e.dataTransfer.files.length > 0) {
                processImage(e.dataTransfer.files[0]);
            }
        });

        downloadBtn.addEventListener('click', () => {
            const dataURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = currentFilename;
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('Téléchargement lancé !', 'info');
        });

        resetBtn.addEventListener('click', () => {
            resultContainer.classList.add('hidden');
            dropZone.classList.remove('hidden');
            fileInput.value = ''; // Réinitialiser l'input
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

    </script>
</body>
</html>
