<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEE PHOTO INVERT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .neon-border {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(168, 85, 247, 0.2);
            border: 2px solid rgba(168, 85, 247, 0.5);
        }

        .neon-text {
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
        .scanner-line {
            height: 2px;
            background: linear-gradient(to right, transparent, #a855f7, transparent);
            position: absolute;
            width: 100%;
            z-index: 10;
            animation: scan 2s linear infinite;
            box-shadow: 0 0 8px #a855f7;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <header class="p-6 border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tighter neon-text flex items-center gap-2">
                <i class="fas fa-bolt text-purple-500"></i> SEE INVERT
            </h1>
        </div>
    </header>

    <main class="container mx-auto px-4 py-12 max-w-4xl">
        
        <div id="drop-zone" class="w-full border-2 border-dashed border-slate-700 rounded-3xl p-16 text-center cursor-pointer bg-slate-900/30 hover:border-purple-500/50 transition-all group relative overflow-hidden">
            <input type="file" id="file-input" class="hidden" accept="image/*">
            <div class="relative z-10">
                <div class="w-20 h-20 bg-slate-800 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:scale-110 group-hover:bg-purple-500/10 transition-all">
                    <i class="fas fa-cloud-arrow-up text-3xl text-slate-500 group-hover:text-purple-400"></i>
                </div>
                <h2 class="text-2xl font-bold mb-2">Prêt pour la transformation ?</h2>
                <p class="text-slate-500">Glissez votre bannière ou cliquez ici</p>
            </div>
        </div>

        <div id="editor-container" class="hidden space-y-8 fade-in">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-3">
                    <p class="text-xs font-bold text-slate-500 uppercase tracking-widest px-2">Image Originale</p>
                    <div class="bg-slate-900 rounded-2xl p-2 border border-slate-800">
                        <img id="preview-img" class="w-full h-64 object-contain rounded-xl" src="" alt="Original">
                    </div>
                </div>

                <div class="space-y-3">
                    <p class="text-xs font-bold text-purple-400 uppercase tracking-widest px-2 neon-text">Résultat Inversé</p>
                    <div class="bg-slate-900 rounded-2xl p-2 neon-border relative overflow-hidden h-64 flex items-center justify-center">
                        <div id="loading-overlay" class="hidden absolute inset-0 bg-slate-900/80 z-20 flex flex-col items-center justify-center">
                            <div class="scanner-line"></div>
                            <p class="text-xs font-bold text-purple-400 mt-4 animate-pulse uppercase tracking-widest">Traitement...</p>
                        </div>
                        <canvas id="main-canvas" class="max-w-full max-h-full rounded-lg"></canvas>
                        <div id="empty-state" class="text-slate-700 text-sm italic">En attente...</div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900/50 p-6 rounded-3xl border border-slate-800 flex flex-col sm:flex-row gap-4 items-center justify-between">
                <div>
                    <h3 class="font-bold text-lg">Effet Inversion</h3>
                    <p class="text-sm text-slate-500">Le noir devient blanc, le blanc devient noir.</p>
                </div>
                <div class="flex gap-3 w-full sm:w-auto">
                    <button id="process-btn" class="flex-1 sm:flex-none px-8 py-3 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-bold transition-all shadow-lg shadow-purple-900/20 flex items-center justify-center gap-2">
                        <i class="fas fa-wand-magic-sparkles"></i> Appliquer
                    </button>
                    <button id="reset-btn" class="px-5 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl transition-all">
                        <i class="fas fa-redo"></i>
                    </button>
                </div>
            </div>

            <div id="download-zone" class="hidden flex justify-center pt-4">
                <button id="download-btn" class="group relative px-10 py-4 bg-white text-slate-950 rounded-2xl font-black text-sm uppercase tracking-widest overflow-hidden transition-all hover:scale-105 active:scale-95">
                    <span class="relative z-10 flex items-center gap-2">
                        <i class="fas fa-download"></i> Enregistrer l'image
                    </span>
                </button>
            </div>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50"></div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const editorContainer = document.getElementById('editor-container');
        const previewImg = document.getElementById('preview-img');
        const processBtn = document.getElementById('process-btn');
        const resetBtn = document.getElementById('reset-btn');
        const downloadBtn = document.getElementById('download-btn');
        const downloadZone = document.getElementById('download-zone');
        const loadingOverlay = document.getElementById('loading-overlay');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const emptyState = document.getElementById('empty-state');

        function notify(msg) {
            const t = document.createElement('div');
            t.className = 'bg-purple-600 text-white px-6 py-3 rounded-xl shadow-2xl font-bold text-sm mb-3 fade-in border border-purple-400';
            t.innerText = msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                dropZone.classList.add('hidden');
                editorContainer.classList.remove('hidden');
                canvas.width = 0; canvas.height = 0;
                downloadZone.classList.add('hidden');
                emptyState.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        processBtn.onclick = () => {
            if (!previewImg.src) return;

            loadingOverlay.classList.remove('hidden');
            emptyState.classList.add('hidden');

            setTimeout(() => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;

                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = 255 - data[i];
                        data[i + 1] = 255 - data[i + 1];
                        data[i + 2] = 255 - data[i + 2];
                    }

                    ctx.putImageData(imageData, 0, 0);
                    loadingOverlay.classList.add('hidden');
                    downloadZone.classList.remove('hidden');
                    notify("Transformation terminée !");
                };
                img.src = previewImg.src;
            }, 800);
        };

        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);
        
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('border-purple-500'); };
        dropZone.ondragleave = () => dropZone.classList.remove('border-purple-500');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            handleFile(e.dataTransfer.files[0]);
        };

        resetBtn.onclick = () => location.reload();

        downloadBtn.onclick = () => {
            const link = document.createElement('a');
            link.download = 'neon_invert_result.png';
            link.href = canvas.toDataURL();
            link.click();
        };
    </script>
</body>
</html>
